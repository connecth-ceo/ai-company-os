name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Compile and dependency check
        run: |
          python -m compileall -q app scripts tests
          python -m pip check
          python -m pip wheel . --no-deps --wheel-dir /tmp/wheels
      - name: Validate PostgreSQL migration DDL
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://user:password@db/test
          TASK_EXECUTION_MODE: inline
          AI_PROVIDER: mock
          AUTH_ENABLED: "false"
          AUTO_CREATE_SCHEMA: "false"
        run: |
          alembic upgrade head --sql > /tmp/upgrade.sql
          test "$(grep -c 'CREATE TYPE taskstatus' /tmp/upgrade.sql)" -eq 1
          alembic downgrade 12738dc9272a:base --sql > /tmp/downgrade.sql
          grep -q 'DROP TYPE taskstatus' /tmp/downgrade.sql
      - name: Validate Compose definitions
        env:
          APP_DOMAIN: ai-company.example.com
          ACME_EMAIL: owner@example.com
          APP_API_KEY: ci-only-api-key-with-at-least-32-characters
          OPENAI_API_KEY: ci-only-openai-key
          POSTGRES_PASSWORD: ci-only-database-password
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config -q
          docker compose --env-file deploy/.env.vps.example -f deploy/compose.vps.yml config -q
      - name: Validate Caddy HTTPS configuration
        run: >-
          docker run --rm -e APP_DOMAIN=ai-company.example.com
          -e ACME_EMAIL=owner@example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build container
        run: docker build -t ai-company-os:test .

  compose-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install smoke client
        run: python -m pip install httpx
      - name: Start PostgreSQL, Redis, API, and Celery
        run: |
          cp .env.example .env
          docker compose --env-file .env.example up -d --build
      - name: Run end-to-end worker task
        env:
          APP_API_KEY: replace-with-at-least-32-random-characters
        run: python scripts/smoke_deployed_task.py http://127.0.0.1:8000 --timeout 120
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color
      - name: Stop disposable integration stack
        if: always()
        run: docker compose --env-file .env.example down -v
