services:
  - type: web
    name: ai-company-os
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: TASK_EXECUTION_MODE
        value: worker
      - key: AUTH_ENABLED
        value: "true"
      - key: APP_API_KEY
        generateValue: true
      - key: DEFAULT_TENANT_ID
        value: owner
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_TRACING_ENABLED
        value: "false"
      - key: OPENAI_STORE_RESPONSES
        value: "false"
      - key: OPENAI_MONTHLY_BUDGET_USD
        value: "10.0"
      - key: DELEGATION_APPROVAL_COST_THRESHOLD_USD
        value: "1.0"
      - key: DELEGATION_APPROVAL_ROLES
        value: legal_review
      - key: DELEGATION_DISPATCH_STALE_SECONDS
        value: "300"
      - key: DELEGATION_RECOVERY_GRACE_SECONDS
        value: "120"
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ENABLED
        sync: false
      - key: TELEGRAM_ALLOWED_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-company-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-company-queue
          property: connectionString

  - type: worker
    name: ai-company-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: TASK_EXECUTION_MODE
        value: worker
      - key: AUTH_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: openai
      - key: APP_API_KEY
        fromService:
          type: web
          name: ai-company-os
          envVarKey: APP_API_KEY
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_TRACING_ENABLED
        value: "false"
      - key: OPENAI_STORE_RESPONSES
        value: "false"
      - key: OPENAI_MONTHLY_BUDGET_USD
        fromService:
          type: web
          name: ai-company-os
          envVarKey: OPENAI_MONTHLY_BUDGET_USD
      - key: DELEGATION_APPROVAL_COST_THRESHOLD_USD
        fromService:
          type: web
          name: ai-company-os
          envVarKey: DELEGATION_APPROVAL_COST_THRESHOLD_USD
      - key: DELEGATION_APPROVAL_ROLES
        fromService:
          type: web
          name: ai-company-os
          envVarKey: DELEGATION_APPROVAL_ROLES
      - key: DELEGATION_DISPATCH_STALE_SECONDS
        fromService:
          type: web
          name: ai-company-os
          envVarKey: DELEGATION_DISPATCH_STALE_SECONDS
      - key: DELEGATION_RECOVERY_GRACE_SECONDS
        fromService:
          type: web
          name: ai-company-os
          envVarKey: DELEGATION_RECOVERY_GRACE_SECONDS
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: ai-company-os
          envVarKey: OPENAI_API_KEY
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          type: web
          name: ai-company-os
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_ENABLED
        fromService:
          type: web
          name: ai-company-os
          envVarKey: TELEGRAM_ENABLED
      - key: TELEGRAM_ALLOWED_CHAT_ID
        fromService:
          type: web
          name: ai-company-os
          envVarKey: TELEGRAM_ALLOWED_CHAT_ID
      - key: TELEGRAM_WEBHOOK_SECRET
        fromService:
          type: web
          name: ai-company-os
          envVarKey: TELEGRAM_WEBHOOK_SECRET
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: ai-company-os
          envVarKey: PUBLIC_BASE_URL
      - key: DATABASE_URL
        fromDatabase:
          name: ai-company-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-company-queue
          property: connectionString

  - type: keyvalue
    name: ai-company-queue
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: ai-company-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: ai_company
    user: ai_company
    ipAllowList: []
